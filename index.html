<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="누구나 편집하고 한 장의 PNG로 저장하는 영화 리뷰 시트">
  <title>빵리뷰 메이커 — Movie Review Sheet Maker</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TetraTheta/RIDIBatang-subset/dist/style/RIDIBatang-subset-web.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="styles.css?v=mobile-pan-final">
</head>
<body>
  <header class="studio-header">
    <button class="mobile-editor-toggle" id="mobileEditorToggle" type="button" aria-controls="editorPanel" aria-expanded="false">☰ 설정</button>
    <div class="studio-brand"><strong>빵리뷰 메이커</strong><span>MOVIE REVIEW SHEET MAKER</span></div>
    <p>모든 입력은 현재 브라우저에만 저장됩니다.</p>
    <div class="header-buttons"><button class="secondary" id="resetAll">초기화</button><button class="primary" id="savePng">PNG 저장</button></div>
  </header>

  <main class="workspace">
    <aside class="editor" id="editorPanel" aria-label="리뷰 시트 설정">
      <div class="editor-intro"><span>LIVE EDITOR</span><h1>영화 리뷰 시트</h1><p>입력하는 즉시 오른쪽 시트에 반영됩니다.</p><button class="mobile-editor-close" id="mobileEditorClose" type="button" aria-label="설정 닫기">×</button></div>

      <details open>
        <summary><b>01</b> 디자인과 이미지</summary>
        <div class="fields">
          <label>포인트 컬러<input type="color" id="accentInput" value="#a8a8a8"></label>
          <label>시트 배경색<input type="color" id="backgroundColorInput" value="#050505"></label>
          <label>상단 문구<input id="brandInput" maxlength="24" placeholder="상단 문구"></label>
          <label>폰트<select id="fontInput"><option value="pretendard">Pretendard</option><option value="noto">Noto Sans KR</option><option value="ridi">리디바탕</option><option value="galmuri">Galmuri</option></select></label>
          <label class="upload">상단 메인 이미지<input type="file" id="heroUpload" accept="image/*"><span>이미지 선택</span></label>
          <label class="upload">영화 포스터<input type="file" id="posterUpload" accept="image/*"><span>이미지 선택</span></label>
        </div>
      </details>

      <details open>
        <summary><b>02</b> 영화 정보</summary>
        <div class="fields">
          <label>영화 제목<input id="titleInput"></label>
          <label>소제목<input id="engTitleInput"></label>
          <div class="two"><label>개봉 연도<input id="yearInput"></label><label>장르<input id="genreInput"></label></div>
          <label>감독 / 제작<input id="directorInput"></label>
          <label>영화 소개<textarea id="synopsisInput"></textarea></label>
          <label>태그<input id="tagsInput" placeholder="#드라마 #성장 #여름"></label>
        </div>
      </details>

      <details open>
        <summary><b>03</b> 핵심 질문</summary>
        <div class="fields">
          <label>질문 상단 문구<input id="questionLabelInput" maxlength="40" placeholder="QUESTION OF THE FILM"></label>
          <label>질문 번호<input id="questionNumberInput" maxlength="8" placeholder="Q1"></label>
          <label>질문<input id="questionInput"></label>
          <label>질문에 대한 소개<textarea id="answerInput"></textarea></label>
        </div>
      </details>

      <details open>
        <summary><b>04</b> 리뷰어</summary>
        <div id="reviewerEditors"></div>
        <button class="add-reviewer" id="addReviewer">＋ 리뷰어 추가</button>
      </details>
    </aside>
    <button class="editor-backdrop" id="editorBackdrop" type="button" aria-label="설정 닫기"></button>

    <section class="stage">
      <div class="stage-note"><span>PREVIEW</span><p id="directEditStatus">이미지 클릭 · 드래그 이동 · 휠 확대/축소 · 방향키 미세조정</p></div>
      <div class="sheet-frame">
        <article class="sheet" id="captureSheet">
          <header class="sheet-hero" id="sheetHero">
            <div class="hero-image-layer" id="heroImageLayer"></div>
            <nav class="sheet-nav"><strong data-brand>RE:FRAME</strong><span>영화</span><span>리뷰</span><span>나의 리스트</span></nav>
            <div class="hero-grain"></div>
          </header>

          <div class="sheet-body">
            <section class="movie-overview">
              <div class="poster-view" id="posterView"><span>POSTER<br>IMAGE</span></div>
              <div class="movie-copy">
                <p class="section-label">FEATURED FILM <i>01</i></p>
                <h2 id="titleView"></h2>
                <p class="english-title" id="engTitleView"></p>
                <p class="movie-meta"><span id="yearView"></span><span id="genreView"></span><span id="directorView"></span></p>
                <p class="synopsis" id="synopsisView"></p>
                <p class="tags" id="tagsView"></p>
              </div>
            </section>

            <section class="question-block">
              <strong id="questionNumberView">Q1</strong>
              <div><p class="section-label" id="questionLabelView">QUESTION OF THE FILM</p><h3 id="questionView"></h3><p id="answerView"></p></div>
            </section>

            <section class="reviews" id="reviewsView"></section>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js?v=empty-example-reset"></script>
</body>
</html>
