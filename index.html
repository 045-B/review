<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="캐릭터와 세 가지 모티브를 간결하게 기록하는 비주얼 보드">
  <title>Motif Note — 캐릭터 모티브 보드</title>
  <style>
    :root{--accent:#7b61c9;--text:#181818;--line:#e6e6e6;--soft:#f4f4f4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:#f3f3f3;font-family:Arial,"Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button,label{-webkit-tap-highlight-color:transparent}.shell{min-height:100vh;padding:20px}.toolbar{position:sticky;top:14px;z-index:30;width:min(1120px,100%);height:58px;margin:0 auto 18px;padding:7px 8px 7px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;background:#fffffff0;backdrop-filter:blur(12px);box-shadow:0 5px 24px #0000000f}.brand{font-size:12px;font-weight:800;letter-spacing:.18em}.toggle{padding:3px;display:flex;border-radius:10px;background:var(--soft)}.toggle button{padding:8px 15px;border:0;border-radius:8px;color:#777;background:transparent;font-size:12px;font-weight:700;cursor:pointer}.toggle button.active{color:#fff;background:var(--accent)}.edit{justify-self:end;padding:10px 19px;border:0;border-radius:9px;color:#fff;background:var(--accent);font-size:12px;font-weight:800;cursor:pointer}.board{width:min(1280px,100%);margin:auto;padding:clamp(26px,5vw,70px);border-radius:22px;background:#fff;box-shadow:0 12px 50px #00000012;transition:max-width .35s}.board.tall{max-width:760px}.profile{min-height:240px;display:grid;grid-template-columns:190px 1fr auto;align-items:center;gap:clamp(24px,5vw,65px);padding-bottom:52px;border-bottom:1px solid var(--line)}.photo{position:relative;width:190px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:50%;color:#fff;background:var(--accent);cursor:pointer}.photo img,.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo>span{font-size:64px;font-weight:800}.photo input,.visual input{position:absolute;opacity:0;pointer-events:none}.photo em{position:absolute;z-index:2;left:50%;bottom:13px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;color:#fff;background:#0009;font-size:10px;font-style:normal;white-space:nowrap;opacity:0}.photo:hover em{opacity:1}.kicker,.heading p{margin:0;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em}.profile h1{margin:10px 0 12px;font-size:clamp(52px,7vw,92px);line-height:.95;letter-spacing:-.07em}.subtitle{margin:0;color:#555;font-size:clamp(16px,2vw,22px)}.index{align-self:start;padding-top:20px;text-align:right}.index span{display:block;margin-bottom:3px;color:#999;font-size:9px;letter-spacing:.15em}.index strong{color:var(--accent);font-size:32px}.motifs{padding:64px 0;border-bottom:1px solid var(--line)}.heading{display:flex;align-items:flex-start;gap:18px;margin-bottom:25px}.heading>span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--accent);font-size:11px;font-weight:800}.heading h2{margin:5px 0 0;font-size:30px;letter-spacing:-.05em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff}.visual{position:relative;height:390px;display:grid;place-items:center;overflow:hidden;color:#999;background:#f0f0f0;cursor:pointer}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#0006);pointer-events:none}.visual>span{z-index:1;padding:8px 13px;border-radius:999px;color:#666;background:#ffffffe6;font-size:11px}.visual b{position:absolute;z-index:2;right:15px;bottom:12px;color:#fff;font-size:28px}.v1{background:linear-gradient(145deg,#eee 50%,color-mix(in srgb,var(--accent) 18%,#fff) 50%)}.v2{background:linear-gradient(35deg,#e8e8e8 45%,color-mix(in srgb,var(--accent) 28%,#fff) 45%)}.v3{background:linear-gradient(160deg,#f4f4f4 60%,color-mix(in srgb,var(--accent) 22%,#fff) 60%)}.info{min-height:175px;padding:20px;border-top:4px solid var(--accent)}.info p{margin:0;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.13em}.info h3{margin:9px 0 5px;font-size:24px;letter-spacing:-.04em}.info span{color:#555;font-size:12px;font-weight:700}.info em{display:block;margin-top:24px;color:#777;font-size:13px;font-style:normal}footer{padding-top:24px;display:flex;justify-content:space-between;color:#999;font-size:9px;font-weight:800;letter-spacing:.14em}.board.tall .profile{grid-template-columns:1fr;justify-items:center;gap:20px;padding-top:16px;text-align:center}.board.tall .photo{width:170px}.board.tall .index{display:none}.board.tall .heading{justify-content:center}.board.tall .grid{grid-template-columns:1fr}.board.tall .card{display:grid;grid-template-columns:1.15fr 1fr}.board.tall .visual{height:280px}.board.tall .info{border-top:0;border-left:4px solid var(--accent)}.panel{position:fixed;z-index:50;top:14px;right:14px;bottom:14px;width:min(420px,calc(100vw - 28px));overflow:auto;padding:25px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 60px #0003;transform:translateX(calc(100% + 30px));transition:transform .25s}.panel.open{transform:none}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.panel-head p{margin:0 0 4px;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.17em}.panel-head h2{margin:0;font-size:30px}.close{width:36px;aspect-ratio:1;border:0;border-radius:50%;background:var(--soft);font-size:22px;cursor:pointer}.panel fieldset{margin:0 0 26px;padding:0;border:0}.panel legend,.panel label{display:grid;gap:7px;width:100%;margin-bottom:14px;color:#444;font-size:11px;font-weight:800}.swatches{display:flex;align-items:center;gap:9px;margin-top:11px}.swatches button{width:28px;aspect-ratio:1;border:3px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px #ddd}.custom{position:relative;margin-left:auto!important}.custom input{width:40px!important;height:30px;padding:0!important;opacity:.01}.custom span{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:9px;text-align:center}.panel input,.panel textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:9px;background:#fafafa;outline:0}.panel input:focus,.panel textarea:focus{border-color:var(--accent)}.panel textarea{min-height:72px;resize:vertical}.divider{margin:27px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--line);color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.13em}.done{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;color:#fff;background:var(--accent);font-weight:800;cursor:pointer}
    @media(max-width:760px){.shell{padding:8px}.toolbar{top:7px;height:54px;padding-left:14px;margin-bottom:9px}.brand{font-size:10px}.toggle button{padding:7px 10px}.edit{padding:9px 13px}.board,.board.tall{max-width:100%;padding:28px 18px;border-radius:17px}.profile,.board.tall .profile{min-height:0;grid-template-columns:92px 1fr;justify-items:initial;gap:18px;padding:0 0 34px;text-align:left}.photo,.board.tall .photo{width:92px}.photo>span{font-size:36px}.profile h1{margin:6px 0 8px;font-size:clamp(42px,14vw,68px)}.kicker{font-size:8px}.subtitle{font-size:14px}.index{display:none}.motifs{padding:42px 0}.heading h2{font-size:25px}.grid,.board.tall .grid{grid-template-columns:1fr;gap:12px}.card,.board.tall .card{display:grid;grid-template-columns:1.05fr .95fr}.visual,.board.tall .visual{height:230px}.info,.board.tall .info{min-height:230px;padding:15px;border-top:0;border-left:4px solid var(--accent)}.info h3{font-size:19px}.info em{margin-top:17px;font-size:11px}}@media(max-width:430px){.brand{display:none}.toolbar{grid-template-columns:1fr auto}.card,.board.tall .card{grid-template-columns:1fr}.visual,.board.tall .visual{height:310px}.info,.board.tall .info{min-height:auto;border-left:0;border-top:4px solid var(--accent)}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="toolbar"><span class="brand">MOTIF NOTE</span><div class="toggle"><button class="active" data-layout="wide">가로형</button><button data-layout="tall">세로형</button></div><button class="edit" id="openEditor">편집</button></header>
    <section class="board wide" id="board">
      <header class="profile"><label class="photo"><span id="initial">한</span><img id="profilePreview" hidden alt="프로필 이미지"><input id="profileUpload" type="file" accept="image/*"><em>사진 변경</em></label><div><p class="kicker">CHARACTER PROFILE</p><h1 id="characterView">한여름</h1><p class="subtitle" id="subtitleView">빛이 오래 머무는 사람</p></div><div class="index"><span>ARCHIVE</span><strong>001</strong></div></header>
      <section class="motifs"><div class="heading"><span>01</span><div><p>MOTIF REFERENCES</p><h2>세 개의 장면</h2></div></div><div class="grid" id="motifGrid"></div></section>
      <footer><span>MOTIF NOTE</span><span>MADE FOR YOUR CHARACTER</span></footer>
    </section>
    <aside class="panel" id="editor"><div class="panel-head"><div><p>LIVE EDITOR</p><h2>내용 편집</h2></div><button class="close" id="closeEditor" aria-label="편집 닫기">×</button></div><fieldset><legend>포인트 컬러</legend><div class="swatches" id="swatches"></div></fieldset><label>캐릭터 이름<input id="characterInput" value="한여름"></label><label>한 줄 소개<input id="subtitleInput" value="빛이 오래 머무는 사람"></label><div id="motifForms"></div><button class="done" id="doneEditor">편집 완료</button></aside>
  </main>
  <script>
    const motifs=[{source:'FILM · 2001',name:'윤슬의 오후',genre:'청춘 · 로맨스',note:'비 온 뒤 창가에 남은 빛',image:''},{source:'NOVEL · 1998',name:'여름의 궤도',genre:'드라마 · 성장',note:'말보다 먼저 건네는 온기',image:''},{source:'ANIMATION · 2016',name:'푸른 정원',genre:'판타지 · 일상',note:'새벽녘 풀잎의 짙은 향',image:''}];
    const colors=['#7b61c9','#ef5b6c','#2878ff','#25a36f','#f08a24','#222222'];
    const grid=document.querySelector('#motifGrid'),forms=document.querySelector('#motifForms');
    function render(){grid.innerHTML=motifs.map((m,i)=>`<article class="card"><label class="visual v${i+1}">${m.image?`<img src="${m.image}" alt="${m.name} 모티브">`:'<span>이미지 추가</span>'}<input type="file" accept="image/*" data-upload="${i}"><b>0${i+1}</b></label><div class="info"><p>${m.source}</p><h3>${m.name}</h3><span>${m.genre}</span><em>${m.note}</em></div></article>`).join('');document.querySelectorAll('[data-upload]').forEach(el=>el.onchange=e=>{const f=e.target.files[0];if(f){motifs[+e.target.dataset.upload].image=URL.createObjectURL(f);render()}})}
    function makeForms(){forms.innerHTML=motifs.map((m,i)=>`<div class="divider">모티브 0${i+1}</div><label>캐릭터 / 제목<input data-i="${i}" data-k="name" value="${m.name}"></label><label>작품 / 출처<input data-i="${i}" data-k="source" value="${m.source}"></label><label>장르<input data-i="${i}" data-k="genre" value="${m.genre}"></label><label>핵심 모티브<textarea data-i="${i}" data-k="note">${m.note}</textarea></label>`).join('');forms.querySelectorAll('input,textarea').forEach(el=>el.oninput=e=>{motifs[+e.target.dataset.i][e.target.dataset.k]=e.target.value;render()})}
    render();makeForms();
    document.querySelectorAll('[data-layout]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-layout]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');board.className='board '+btn.dataset.layout});
    openEditor.onclick=()=>editor.classList.add('open');closeEditor.onclick=doneEditor.onclick=()=>editor.classList.remove('open');
    characterInput.oninput=e=>{characterView.textContent=e.target.value;initial.textContent=e.target.value.slice(0,1)};subtitleInput.oninput=e=>subtitleView.textContent=e.target.value;
    profileUpload.onchange=e=>{const f=e.target.files[0];if(f){profilePreview.src=URL.createObjectURL(f);profilePreview.hidden=false;initial.hidden=true}};
    const swatches=document.querySelector('#swatches');colors.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>document.documentElement.style.setProperty('--accent',c);swatches.appendChild(b)});swatches.insertAdjacentHTML('beforeend','<label class="custom"><input type="color" value="#7b61c9" id="colorPick"><span>직접 선택</span></label>');colorPick.oninput=e=>document.documentElement.style.setProperty('--accent',e.target.value);
  </script>
</body>
</html>
